# Les pages (/kanban, /demandes/3, /admin…) sont gérées par React dans le
# navigateur : il n'existe pas de fichier à ces chemins sur le serveur.
# Si on recharge une de ces pages, nginx renvoie index.html et React prend le relais.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
